{% extends "base_auth.html" %}

{% block content %}
<div class="w-full max-w-md md:max-w-lg bg-white p-6 md:p-8 rounded-xl shadow-sm border">

    <h2 class="text-2xl md:text-3xl font-semibold text-center mb-6">
        Login
    </h2>

    {% if error %}
        <div class="bg-red-100 text-red-700 p-3 rounded-lg mb-4 text-sm">
            {{ error }}
        </div>
    {% endif %}

    <form method="post" class="space-y-5">
        {% csrf_token %}

        <div>
            <label class="block text-sm font-medium mb-1">Username</label>
            <input type="text" name="username"
                class="w-full border rounded-lg px-4 py-3 text-base
                       focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div>
            <label class="block text-sm font-medium mb-1">Password</label>

            <div class="relative">
                <input type="password" name="password" id="login-password"
                    class="w-full border rounded-lg px-3 py-2 pr-20
                            focus:ring-2 focus:ring-blue-500 focus:outline-none">

                <button type="button"
                        onclick="togglePassword('login-password', this)"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-sm text-blue-600 font-medium">
                    Show Password
                </button>
            </div>
        </div>

        <button type="submit"
            class="w-full bg-blue-600 text-white py-3 rounded-lg text-base
                   hover:bg-blue-700 transition">
            Login
        </button>
    </form>

    <p class="text-sm text-center mt-5">
        Don’t have an account?
        <a href="{% url 'register' %}" class="text-blue-600 hover:underline">
            Create one
        </a>
    </p>
</div>
<script>
function togglePassword(id, btn) {
    const input = document.getElementById(id);

    if (input.type === "password") {
        input.type = "text";
        btn.innerText = "Hide Password";
    } else {
        input.type = "password";
        btn.innerText = "Show Password";
    }
}
</script>
{% endblock %}
