{% extends "base_auth.html" %}

{% block content %}
<div class="w-full max-w-md bg-white p-6 md:p-8 rounded-xl shadow-sm border">

    <h2 class="text-2xl font-semibold text-center mb-6">
        Reset Password
    </h2>

    {% if error %}
        <div class="bg-red-100 text-red-700 p-3 rounded-lg mb-4 text-sm">
            {{ error }}
        </div>
    {% endif %}

    {% if success %}
        <div class="bg-green-100 text-green-700 p-3 rounded-lg mb-4 text-sm">
            {{ success }}
        </div>
    {% endif %}

    <form method="post" class="space-y-4">
        {% csrf_token %}

        <!-- Username -->
        <div>
            <label class="block text-sm font-medium mb-1">Username</label>
            <input type="text" name="username"
                class="w-full border rounded-lg px-3 py-2">
        </div>

        <!-- New Password -->
        <div>
            <label class="block text-sm font-medium mb-1">New Password</label>
            <div class="relative">
                <input type="password" name="new_password" id="id_password" class="w-full border rounded-lg px-3 py-2">
                <button type="button"
                        onclick="togglePassword('id_password', this)"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-sm text-blue-600 font-medium">
                    Show Password
                </button>
            </div>
        </div>

        <!-- ADMIN PASS KEY (your "super secret") -->
        <div>
            <label class="block text-sm font-medium mb-1">Admin Pass Key</label>
            <input type="password" name="admin_key"
                class="w-full border rounded-lg px-3 py-2">

        </div>

        <button type="submit"
            class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">
            Reset Password
        </button>
    </form>
</div>
<script>
function toggleAdminKey() {
    const role = document.getElementById("role").value;
    const field = document.getElementById("admin-key-field");
    field.classList.toggle("hidden", role !== "admin");
}

// Toggle password visibility
function togglePassword(id, btn) {
    const input = document.getElementById(id);

    if (input.type === "password") {
        input.type = "text";
        btn.innerText = "Hide Password";
    } else {
        input.type = "password";
        btn.innerText = "Show Password";
    }
}
</script>
{% endblock %}
